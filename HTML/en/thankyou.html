<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASD | Thank You</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Monda:wght@400..700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- Site Favicon and Custom Styles -->
    <link rel="shortcut icon" href="../assets/images/cover.png" type="image/png">
    <link rel="stylesheet" href="../assets/css/custom.css" type="text/css">

    <style>
        /* Decorative right-side accent bar matching your site main Pink */
        .right-accent-bar {
            width: 20px;
            background-color: #ff32cd;
            /* var(--mainPinkColor) */
            z-index: 1001;
        }

        /* Align Feedback Title with h2.section-title in custom.css */
        .feedback-page-title {
            font-family: 'Monda', sans-serif !important;
            font-size: 3.375rem !important;
            font-weight: 900 !important;
            line-height: 1.11 !important;
            color: #565a5f !important;
            /* var(--darkGreyColor) */
        }

        /* Align Green Bar with other page footers */
        .feedback-green-bar {
            width: 100px !important;
            height: 6px !important;
            background-color: #82f000 !important;
            /* var(--mainGreenColor) */
            margin-top: 1rem !important;
        }

        /* Main structure spacing over footer */
        main {
            min-height: 450px;
        }
    </style>
</head>

<body class="white-header">

    <!-- Decorative right-side accent bar (Only visible on MD screens and up) -->
    <div class="right-accent-bar position-fixed top-0 end-0 h-100 d-none d-md-block"></div>

    <!-- Main Content Container -->
    <div class="container py-5">

        <!-- Page header: Logos and Report Title -->
        <header class="fixed-header d-flex align-items-center">
            <div class="container h-100">
                <div class="row justify-content-between align-items-center">
                    <div class="col-8 asd-logo">
                        <a href="https://www.archsd.gov.hk/tc/" class="nav-link d-flex align-items-end" target="_blank">
                            <img src="../assets/images/asd-logo.svg" alt="Site Logo" title="Sustainability Report 2026">
                        </a>
                    </div>
                    <div class="col-4 SD2026 site-title">
                        <a href="index.html" class="nav-link">
                            <img src="../assets/images/SD2026.svg" alt="Site Title" title="Sustainability Report 2026">
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Menu Placeholder -->
        <div id="nav-placeholder"></div>

        <!-- Main Feedback Block (2-Column Grid Layout) -->
        <main class="row pt-5 mt-5 gy-4 align-items-start">

            <!-- Left Side: Page Title and Green Indicator (1/3 Width) -->
            <div class="col-12 col-lg-4 d-flex flex-column align-items-start justify-content-start">
                <h1 class="feedback-page-title">
                    Feedback
                </h1>
                <div class="feedback-green-bar"></div>
            </div>

            <!-- Right Side: Content block (2/3 Width) -->
            <div class="col-12 col-lg-8 d-flex flex-column align-items-start justify-content-start gap-3">
                <h2 class="text-dark font-light m-0" style="font-family: 'Inter', sans-serif;">
                    Thank you.
                </h2>
                <p class="text-secondary m-0 font-light" style="font-family: 'Inter', sans-serif; font-size: 1.25rem;">
                    We appreciate your feedback.
                </p>
            </div>

        </main>

        <!-- Pagination Links -->
        <div class="feedback-page-nav-line row justify-content-between">
            <div class="col-6 p-0">
                <a href="report-verification.html" class="feedback-page-nav-link">
                    <div class="feedback-page-nav feedback-page-back d-flex align-items-center">
                        <div aria-hidden="true">
                            <img src="../assets/images/page-nav-icon.svg" class="feedback-page-nav-icon" alt="">
                        </div>
                        <p class="feedback-page-nav-title ms-2">Report Verification</p>
                    </div>
                </a>
            </div>
            <div class="col-6 p-0 text-end d-flex justify-content-end">
                <a href="glossary.html" class="feedback-page-nav-link">
                    <div class="feedback-page-nav feedback-page-next d-flex align-items-center">
                        <p class="feedback-page-nav-title me-2">Glossary</p>
                        <div aria-hidden="true">
                            <img src="../assets/images/page-nav-icon.svg" class="feedback-page-nav-icon" alt="">
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <!-- Site footer -->
        <footer class="site-footer mt-5" role="contentinfo">
            <div class="row">
                <div class="col-12">

                    <!-- Footer accent line -->
                    <div class="footer-green-bar"></div>

                    <!-- Footer links -->
                    <p class="mb-0 text-white-5">
                        2026 &copy; |
                        <a target="_blank" aria-label="Important notices (opens in a new window)"
                            href="https://www.archsd.gov.hk/en/important-notices.html" rel="noopener noreferrer">
                            Important notices
                        </a>
                        |
                        <a target="_blank" aria-label="Privacy Policy (opens in a new window)"
                            href="https://www.archsd.gov.hk/en/privacy-policy.html" rel="noopener noreferrer">
                            Privacy
                        </a>
                        |
                        <a aria-label="Go to Sitemap" href="sitemap.html">
                            Sitemap
                        </a>
                    </p>

                </div>
            </div>
        </footer>

    </div> <!-- Container End -->

    <!-- Back-to-top button -->
    <button type="button" id="back-to-top" tabindex="0" aria-label="Back to Top">
        <img src="../assets/images/back-to-top.svg" alt="Back to Top" title="Back to Top">
    </button>

    <!-- JavaScript Libraries -->
    <script src="../assets/js/gsap.min.js" crossorigin="anonymous"></script>
    <script src="../assets/js/ScrollTrigger.min.js" crossorigin="anonymous"></script>
    <script src="../assets/js/ScrollToPlugin.min.js" crossorigin="anonymous"></script>
    <script src="../assets/js/lottie.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

    <!-- Site Utility Scripts -->
    <script src="../assets/js/general.js" defer></script>
    <script src="../assets/js/menu.js" defer></script>

    <!-- GSAP Back-to-top Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            gsap.registerPlugin(ScrollTrigger);

            const backToTop = document.getElementById('back-to-top');
            const footer = document.querySelector('.feedback-site-footer');

            if (backToTop && footer) {
                ScrollTrigger.create({
                    trigger: footer,
                    start: "top bottom",
                    end: "bottom bottom",
                    onUpdate: (self) => {
                        const progress = self.progress;
                        const footerHeight = footer.offsetHeight;
                        const targetBottom = 30 + (progress * footerHeight);

                        gsap.to(backToTop, {
                            bottom: targetBottom,
                            duration: 0.1,
                            overwrite: "auto"
                        });
                    },
                    onLeaveBack: () => {
                        gsap.to(backToTop, {
                            bottom: 30,
                            duration: 0.2,
                            overwrite: "auto"
                        });
                    }
                });
            }
        });
    </script>

</body>

</html>
