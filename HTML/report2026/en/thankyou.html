        <div id="nav-placeholder"></div>

        <div class="thankyou-page-container">

            <main id="main-content" class="row" tabindex="-1">

                <h1 class="accessibility">Feedback</h1>
                <div class="page-title d-none" aria-hidden="true">Feedback</div>

                <!-- Row 1: "Feedback" Section Title -->
                <div class="col-12 col-lg-4">
                    <div class="title-block">
                        <h2 class="section-title">Feedback</h2>
                    </div>
                </div>

                <!-- Row 2: Thank You Content, placed in the correct grid columns -->
                <div class="col-12 col-lg-7 offset-lg-1 ps-lg-0">
                    <!-- The Unified Component Wrapper -->
                    <div class="thankyou-content-wrapper">

                        <!-- Layer 1: Background Image (Bottom) -->
                        <img src="../assets/images/appendix-feedback.png" class="thankyou-bg-img" alt=""
                            aria-hidden="true">

                        <!-- Layer 2: Text (Middle) -->
                        <h2 class="thankyou-text">We appreciate your feedback</h2>

                        <img src="../assets/images/appendix-feedback-thankyou.png" class="thankyou-title-img"

        <script src="../assets/js/gsap.min.js" crossorigin="anonymous"></script>
        <script src="../assets/js/ScrollTrigger.min.js" crossorigin="anonymous"></script>

        <script src="../assets/js/general.js" defer></script>
        <script src="../assets/js/menu.js" defer></script>

        <!-- Animation Script is now included -->
        <script>
            $(function () {
                gsap.set(".thankyou-bg-img, .thankyou-title-img", { autoAlpha: 0 });

                gsap.fromTo(".thankyou-bg-img",
                    { xPercent: -50, autoAlpha: 0 },
                    { xPercent: 0, autoAlpha: 1, duration: 1.2, ease: "power3.out", delay: 0.5 }
                );
                gsap.fromTo(".thankyou-title-img",
                    { xPercent: 50, autoAlpha: 0 },
                    { xPercent: 0, autoAlpha: 1, duration: 1.2, ease: "power3.out", delay: 0.8 }
                );

            });
        </script>
