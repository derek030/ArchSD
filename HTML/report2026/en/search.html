<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASD | Search</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Monda:wght@400..700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- Site favicon and custom styles -->
    <link rel="shortcut icon" href="../assets/images/cover.png" type="image/png">
    <link rel="stylesheet" href="../assets/css/custom.css" type="text/css">
</head>

<body class="white-header">

    <!-- Accessibility: Skip Link -->
    <a href="#main-content" class="skip-to-content">Skip to main content</a>

    <!-- Page header and site logos -->
    <header class="fixed-header d-flex align-items-center">
        <div class="container h-100">
            <div class="row justify-content-between align-items-center">
                <div class="col-8 asd-logo"><a href="https://www.archsd.gov.hk/tc/"
                        class="nav-link d-flex align-items-end" target="_blank"><img src="../assets/images/asd-logo.svg"
                            alt="Site Logo" title="Sustainability Report 2026"></a></div>
                <div class="col-4 SD2026 site-title"><a href="index.html" class="nav-link "><img
                            src="../assets/images/SD2026.svg" alt="Site Title" title="Sustainability Report 2026"></a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main page container -->
    <div class="container">

        <!-- menu -->
        <div id="nav-placeholder"></div>

        <main id="main-content" class="row feedback-page" tabindex="-1">

            <!-- Left Column: Search Input Area (1/3 Width) -->
            <div class="col-12 col-lg-4" role="region">
                <div class="title-block">
                    <h2 class="section-title">Search</h2>
                </div>


                <!-- Search Form -->
                <form id="searchForm" role="search" class="mb-4">
                    <label for="searchInput" class="visually-hidden">Search Keyword</label>
                    <div class="embedded-search-wrapper">
                        <input type="text" id="searchInput" placeholder="Search for..." class="embedded-search-input"
                            required>

                        <!-- Embedded Search Button inside the input -->
                        <button type="submit" class="embedded-search-btn" aria-label="Submit search">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-search" viewBox="0 0 16 16" aria-hidden="true">
                                <path
                                    d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                            </svg>
                        </button>
                    </div>
                </form>


                <!-- Search Meta Info (Dynamic Frontend Render) -->
                <div id="searchMeta" class="small text-body-secondary" role="status" aria-live="polite">
                    <p class="p2-body-style">Searched Keyword: <strong class="text-dark">sustainability projects</strong></p>
                    <p class="p2-body-style">Results 1 - 3 of about <strong class="text-dark">3</strong>. Search took 0.002 seconds.</p>
                </div>
            </div>

            <!-- Right Column: Search Results Area (2/3 Width) -->
            <div class="col-12 col-md-8 content-align-spacer" role="region" aria-labelledby="search-results-heading">
                <!-- Visually hidden heading for screen readers -->
                <h2 id="search-results-heading" class="visually-hidden">Search Results</h2>

                <!-- Spacer to vertically align first result with the search input field (Styles are in custom.css) -->
                <div class="search-results-align-spacer"></div>

                <!-- Dynamic Results Wrapper -->
                <div id="searchResults" class="d-flex flex-column gap-4">
                    <!-- Default Static Mock Results (Will be refreshed upon submitting the form) -->
                </div>
            </div>

        </main>

        <!-- Site footer -->
        <footer class="site-footer mt-5" role="contentinfo">
            <div class="row">
                <div class="col-12">

                    <!-- Footer accent line -->
                    <div class="footer-green-bar"></div>

                    <!-- Footer links -->
                    <p class="mb-0 text-white-5">
                        2026 &copy; |
                        <a target="_blank" aria-label="Important notices (opens in a new window)"
                            href="https://www.archsd.gov.hk/en/important-notices.html" rel="noopener noreferrer">
                            Important notices
                        </a>
                        |
                        <a target="_blank" aria-label="Privacy Policy (opens in a new window)"
                            href="https://www.archsd.gov.hk/en/privacy-policy.html" rel="noopener noreferrer">
                            Privacy
                        </a>
                        |
                        <a aria-label="Go to Sitemap" href="sitemap.html">
                            Sitemap
                        </a>
                    </p>

                </div>
            </div>
        </footer>

        <!-- Back-to-top button -->
        <button type="button" id="back-to-top" tabindex="0" aria-label="Back to Top">
            <img src="../assets/images/back-to-top.svg" alt="Back to Top" title="Back to Top">
        </button>

        <!-- JavaScript libraries -->
        <script src="../assets/js/gsap.min.js" crossorigin="anonymous"></script>
        <script src="../assets/js/ScrollTrigger.min.js" crossorigin="anonymous"></script>
        <script src="../assets/js/ScrollToPlugin.min.js" crossorigin="anonymous"></script>
        <script src="../assets/js/lottie.min.js" crossorigin="anonymous"></script>

        <!-- Site utility scripts -->
        <script src="../assets/js/qrcode.min.js" defer></script>
        <script src="../assets/js/general.js" defer></script>
        <script src="../assets/js/menu.js" defer></script>

        <!-- jQuery -->
        <script src="../assets/js/jquery-3.7.1.min.js" crossorigin="anonymous"></script>

        <!-- Pure Frontend Search Controller -->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const searchForm = document.getElementById('searchForm');
                const searchInput = document.getElementById('searchInput');

                // 1. Initial Load: Render default results using mockup data
                performMockSearch("sustainability projects");

                // 2. Handle Form Submit (Frontend Only Mock Search)
                searchForm.addEventListener('submit', (event) => {
                    event.preventDefault();
                    const query = searchInput.value.trim();
                    if (query) {
                        performMockSearch(query);
                    }
                });

                /**
                 * Simulated search function that generates placeholder data.
                 */
                function performMockSearch(keyword) {
                    // Temporary Loading State
                    const resultsContainer = document.getElementById('searchResults');
                    resultsContainer.innerHTML = '<p class="text-muted">Searching results...</p>';

                    setTimeout(() => {
                        const mockData = {
                            keyword: keyword,
                            totalResults: 3,
                            searchTime: (Math.random() * 0.1).toFixed(3),
                            items: [
                                {
                                    title: "Awards and Recognition",
                                    snippet: `...繁 简 SUSTAINABILITY REPORT 2026 search A A A... Discover key accomplishments and honors regarding our ${keyword} achievements...`,
                                    url: "www.archsd.gov.hk/archsd/html/report2026/en/awards-n-achievements.html",
                                    size: "23.8K"
                                },
                                {
                                    title: "Green Environments & Climate Resilience",
                                    snippet: `...This section details our innovative architecture layouts, green building materials, and active ${keyword} guidelines for urban development...`,
                                    url: "www.archsd.gov.hk/archsd/html/report2026/en/green-environments.html",
                                    size: "18.4K"
                                },
                                {
                                    title: "Stakeholder Engagement & Interviews",
                                    snippet: `...Read about the interview scripts and valuable input given by external organizations on our upcoming ${keyword} roadmap...`,
                                    url: "www.archsd.gov.hk/archsd/html/report2026/en/stakeholder-engagement.html",
                                    size: "31.2K"
                                }
                            ]
                        };

                        renderSearchResults(mockData);
                    }, 300); // 300ms simulated network delay
                }

                /**
                 * Standardized Renderer function.
                 */
                function renderSearchResults(data) {
                    // Update Meta Info
                    const searchMeta = document.getElementById('searchMeta');
                    searchMeta.innerHTML = `
                    <p>Searched Keyword: <strong class="text-dark">${escapeHTML(data.keyword)}</strong></p>
                    <p>Results 1 - ${data.items.length} of about <strong class="text-dark">${data.totalResults}</strong>. Search took ${data.searchTime} seconds.</p>
                `;

                    // Render Results
                    const resultsContainer = document.getElementById('searchResults');
                    resultsContainer.innerHTML = '';

                    data.items.forEach(item => {
                        const resultHtml = `
                        <div class="border-bottom pb-3">
                            <h3 class="fs-5 mb-1" style="font-family: 'Inter', sans-serif;">
                                <a href="#" class="text-decoration-none text-primary fw-semibold">${escapeHTML(item.title)}</a>
                            </h3>
                            <p class="small text-secondary mb-1">${escapeHTML(item.snippet)}</p>
                            <p class="small text-muted mb-0">
                                <span class="text-break">${escapeHTML(item.url)} - ${item.size}</span>
                                <a href="#" class="text-decoration-none text-secondary ms-2 small">Cached</a>
                            </p>
                        </div>
                    `;
                        resultsContainer.innerHTML += resultHtml;
                    });
                }

                function escapeHTML(str) {
                    return str.replace(/[&<>'"]/g,
                        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
                    );
                }
            });
        </script>
</body>

</html>
